<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DB Web View</title>
  <link rel="stylesheet" href="app.css">
  <script defer src="app.js"></script>
</head>
<body>
  <section id="login" class="login-screen">
    <form id="login-form" class="login-card">
      <div class="brand-mark">DB</div>
      <h1>DB Web View</h1>
      <p>登录后管理应用已连接的数据库</p>
      <label>账号<input id="username" autocomplete="username" required></label>
      <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">登录</button>
      <div id="login-error" class="error" role="alert"></div>
    </form>
  </section>
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark small">DB</span><strong>DB Web View</strong></div>
      <div class="top-actions"><span class="top-caption">数据库管理</span><button id="logout" class="text-button">退出登录</button></div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <label class="field-label" for="source">数据源</label>
        <select id="source"></select>
        <div class="sidebar-heading"><span>数据表</span><button id="refresh-tables" title="刷新数据表">↻</button></div>
        <input id="table-search" class="search" placeholder="搜索表名" aria-label="搜索表名">
        <nav id="table-list" aria-label="数据表"></nav>
      </aside>
      <main class="content">
        <div class="mode-tabs" role="tablist" aria-label="工作区">
          <button id="tab-table" class="mode-tab active" role="tab" aria-selected="true">数据表</button>
          <button id="tab-sql" class="mode-tab" role="tab" aria-selected="false">SQL 控制台</button>
          <button id="tab-audit" class="mode-tab" role="tab" aria-selected="false">操作审计</button>
        </div>
        <section id="table-panel" class="work-panel">
        <div class="content-header">
          <div><div id="breadcrumb" class="eyebrow">请选择数据表</div><h2 id="table-title">选择左侧数据表</h2></div>
          <div class="toolbar"><button id="structure" disabled>表结构</button><button id="export" disabled>导出 CSV</button><button id="refresh" disabled>刷新</button><button id="add" class="primary" disabled>新增记录</button></div>
        </div>
        <div id="table-meta" class="table-meta"></div>
        <div class="table-controls"><button id="add-filter">添加条件</button><button id="apply-filter">筛选</button><button id="clear-filter">清除</button><label>排序 <select id="sort-column"></select></label><label><input id="descending" type="checkbox"> 降序</label></div>
        <div id="filter-list" class="filter-list" aria-label="筛选条件"></div>
        <div id="structure-panel" class="structure-panel hidden"></div>
        <div class="grid-wrap"><table id="data-grid"><thead></thead><tbody></tbody></table><div id="empty" class="empty">选择一张表开始浏览</div></div>
        <footer class="pagination"><span id="page-info"></span><div><button id="prev" disabled>上一页</button><button id="next" disabled>下一页</button></div></footer>
        </section>
        <section id="sql-panel" class="work-panel hidden">
          <div class="content-header"><div><div class="eyebrow">当前数据源：<span id="sql-source">—</span></div><h2>SQL 控制台</h2></div></div>
          <p class="sql-hint">一次执行一条 SQL。支持查询及写入语句；写入和结构变更会立即作用于当前数据源。</p>
          <label for="sql-input" class="field-label">SQL 语句</label>
          <textarea id="sql-input" class="sql-input" spellcheck="false" placeholder="SELECT * FROM your_table LIMIT 20;"></textarea>
          <div class="sql-actions"><span>Ctrl/⌘ + Enter 执行</span><button id="explain-sql">执行计划</button><button id="run-sql" class="primary">执行 SQL</button><button id="cancel-sql" disabled>取消执行</button><button id="export-sql" disabled>导出当前结果 CSV</button></div>
          <div id="sql-status" class="table-meta" role="status">输入 SQL 后点击执行</div>
          <details><summary>执行历史</summary><button id="refresh-history">刷新历史</button><div id="sql-history" class="history-list"></div></details>
          <div class="grid-wrap"><table id="sql-grid"><thead></thead><tbody></tbody></table><div id="sql-empty" class="empty">执行结果将显示在这里</div></div>
        </section>
        <section id="audit-panel" class="work-panel hidden">
          <div class="content-header"><h2>操作审计</h2><button id="refresh-audit">刷新</button></div>
          <p class="sql-hint">显示最近的 SQL 执行和表格增删改记录。配置共享审计数据源后可跨 Pod 查看。</p>
          <div class="grid-wrap"><table id="audit-grid"><thead></thead><tbody></tbody></table></div>
        </section>
      </main>
    </div>
  </div>
  <dialog id="editor">
    <form id="editor-form" method="dialog">
      <div class="dialog-head"><h3 id="editor-title">编辑记录</h3><button type="button" id="close-editor" aria-label="关闭">×</button></div>
      <div id="editor-fields" class="fields"></div>
      <div class="dialog-actions"><button type="button" id="cancel-editor">取消</button><button type="submit" class="primary">保存</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
